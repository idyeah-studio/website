<body>
<section class="magazine-under" aria-label="Page 2: contents preview" inert tabindex="-1"></section>
<div class="magazine-sheet">
<div class="stage">
  <canvas id="back"></canvas>
  <canvas id="front"></canvas>
  <div class="veil"></div>
  <svg class="grain" aria-hidden="true"><filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#gr)" opacity="0.55"/></svg>
</div>

<script>
(function(){
  "use strict";
  var back=document.getElementById('back'), front=document.getElementById('front');
  var bx=back.getContext('2d'), fx=front.getContext('2d');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  var W=0,H=0,dpr=1,narrow=false;
  var irisR=0, irisX=0, irisY=0, ridgeY=0, ridgeAmp=0, lidCx=0;
  var irisImg=null, lashes=[], skyImg=null;

  function ridgeAt(x){
    var d=(x-lidCx)/(W*0.62);
    var y = ridgeY - ridgeAmp*d*d;
    y += Math.sin(x*0.0115+1.7)*H*0.010
       + Math.sin(x*0.0271+4.2)*H*0.0055
       + Math.sin(x*0.0630+0.6)*H*0.0022;
    return y;
  }

  /* ---------- the iris, drawn once ---------- */
  function buildIris(R){
    var px=Math.round(R*2*dpr);
    var c=document.createElement('canvas'); c.width=c.height=px;
    var g=c.getContext('2d');
    g.setTransform(dpr,0,0,dpr,0,0);
    var cxx=R, cyy=R;
    var r=rng(31337);

    // base wash
    var bg=g.createRadialGradient(cxx,cyy,R*0.18,cxx,cyy,R);
    bg.addColorStop(0,'#595959');
    bg.addColorStop(0.42,'#757575');
    bg.addColorStop(0.78,'#505050');
    bg.addColorStop(1,'#2a2a2a');
    g.beginPath(); g.arc(cxx,cyy,R,0,Math.PI*2); g.fill();
    g.fillStyle=bg; g.fill();

    // fibres
    var N = 1700;
    g.lineCap='round';
    for(var i=0;i<N;i++){
      var a = (i/N)*Math.PI*2 + (r()-0.5)*0.26;
      // fibres of different reach, so the eye is woven, not a starburst
      var span=r(), r0, r1;
      if(span<0.36){ r0=R*(0.205+r()*0.06); r1=R*(0.42+r()*0.28); }
      else if(span<0.72){ r0=R*(0.30+r()*0.34); r1=R*(0.80+r()*0.18); }
      else { r0=R*(0.205+r()*0.06); r1=R*(0.88+r()*0.10); }
      var hot = r();
      var col, al, lw;
      if(hot>0.978){ col=231; al=0.32+r()*0.26; lw=0.5+r()*0.9; }
      else if(hot>0.82){ col=190; al=0.24+r()*0.28; lw=0.5+r()*1.3; }
      else if(hot>0.44){ col=139; al=0.26+r()*0.36; lw=0.6+r()*1.8; }
      else { col=26; al=0.28+r()*0.46; lw=0.7+r()*2.4; }

      g.strokeStyle='rgba('+col+','+col+','+col+','+al.toFixed(3)+')';
      g.lineWidth=lw;
      g.beginPath();
      var steps=5, wob=(r()-0.5)*0.10;
      for(var s=0;s<=steps;s++){
        var f=s/steps;
        var rr=r0+(r1-r0)*f;
        var aa=a + wob*Math.sin(f*Math.PI)*1.5 + (r()-0.5)*0.004;
        var px2=cxx+Math.cos(aa)*rr, py2=cyy+Math.sin(aa)*rr;
        if(s===0) g.moveTo(px2,py2); else g.lineTo(px2,py2);
      }
      g.stroke();
    }

    // crypts: small dark pits, scattered wide, never a ring of petals
    for(var k=0;k<260;k++){
      var a2=r()*Math.PI*2, rr2=R*(0.24+Math.pow(r(),0.7)*0.66);
      var w2=R*(0.004+r()*0.016), h2=R*(0.010+r()*0.046);
      g.save();
      g.translate(cxx+Math.cos(a2)*rr2, cyy+Math.sin(a2)*rr2);
      g.rotate(a2);
      g.fillStyle='rgba(9,9,9,'+(0.16+r()*0.36).toFixed(3)+')';
      g.beginPath(); g.ellipse(0,0,h2,w2,0,0,Math.PI*2); g.fill();
      g.restore();
    }

    // collarette: a soft change of ground, not a drawn line
    var col1=g.createRadialGradient(cxx,cyy,R*0.34,cxx,cyy,R*0.56);
    col1.addColorStop(0,'rgba(195,195,195,0)');
    col1.addColorStop(0.5,'rgba(206,206,206,0.18)');
    col1.addColorStop(1,'rgba(195,195,195,0)');
    g.save(); g.globalCompositeOperation='lighter';
    g.fillStyle=col1; g.beginPath(); g.arc(cxx,cyy,R*0.58,0,Math.PI*2); g.fill();
    g.restore();

    // depth: dark limbus, light from upper left
    g.globalCompositeOperation='multiply';
    var dg=g.createRadialGradient(cxx,cyy,R*0.30,cxx,cyy,R*1.02);
    dg.addColorStop(0,'rgba(255,255,255,1)');
    dg.addColorStop(0.66,'rgba(192,192,192,1)');
    dg.addColorStop(0.90,'rgba(62,62,62,1)');
    dg.addColorStop(1,'rgba(7,7,7,1)');
    g.fillStyle=dg; g.fillRect(0,0,R*2,R*2);

    var sh=g.createLinearGradient(0,cyy-R,0,cyy+R);
    sh.addColorStop(0,'rgba(252,252,252,1)');
    sh.addColorStop(0.55,'rgba(198,198,198,1)');
    sh.addColorStop(1,'rgba(88,88,88,1)');
    g.fillStyle=sh; g.fillRect(0,0,R*2,R*2);
    g.globalCompositeOperation='source-over';

    // limbal ring
    g.globalCompositeOperation='source-atop';
    g.lineWidth=R*0.055;
    g.strokeStyle='rgba(5,5,5,0.94)';
    g.beginPath(); g.arc(cxx,cyy,R*0.975,0,Math.PI*2); g.stroke();
    g.globalCompositeOperation='source-over';

    // clip to circle
    var c2=document.createElement('canvas'); c2.width=c2.height=px;
    var g2=c2.getContext('2d'); g2.setTransform(dpr,0,0,dpr,0,0);
    g2.beginPath(); g2.arc(cxx,cyy,R,0,Math.PI*2); g2.closePath(); g2.clip();
    g2.drawImage(c,0,0,R*2,R*2);
    return c2;
  }

  function build(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=back.clientWidth; H=back.clientHeight;
    narrow = W<620;
    [back,front].forEach(function(cc){
      cc.width=Math.round(W*dpr); cc.height=Math.round(H*dpr);
    });
    bx.setTransform(dpr,0,0,dpr,0,0);
    fx.setTransform(dpr,0,0,dpr,0,0);

    ridgeY = H*(narrow?0.635:0.615);
    ridgeAmp = H*(narrow?0.110:0.135);
    lidCx = narrow ? W*0.52 : W*0.645;

    irisR = Math.min(W*(narrow?0.445:0.255), H*(narrow?0.255:0.300));
    irisX = lidCx;
    irisY = ridgeY - irisR*0.46;

    // sky, cached
    skyImg=document.createElement('canvas');
    skyImg.width=back.width; skyImg.height=back.height;
    var s=skyImg.getContext('2d'); s.setTransform(dpr,0,0,dpr,0,0);
    s.fillStyle='#030303'; s.fillRect(0,0,W,H);

    var gl=s.createRadialGradient(irisX,irisY,irisR*0.9,irisX,irisY,irisR*3.6);
    gl.addColorStop(0,'rgba(150,150,150,0.44)');
    gl.addColorStop(0.24,'rgba(109,109,109,0.21)');
    gl.addColorStop(0.58,'rgba(65,65,65,0.08)');
    gl.addColorStop(1,'rgba(28,28,28,0)');
    s.fillStyle=gl; s.fillRect(0,0,W,H);

    // a sheet of heat lying on the hills
    var hz=s.createLinearGradient(0,ridgeY-H*0.20,0,ridgeY+H*0.04);
    hz.addColorStop(0,'rgba(123,123,123,0)');
    hz.addColorStop(0.62,'rgba(139,139,139,0.18)');
    hz.addColorStop(1,'rgba(159,159,159,0.34)');
    s.fillStyle=hz; s.fillRect(0,ridgeY-H*0.20,W,H*0.24);

    irisImg = buildIris(irisR);

    // lashes that are also a treeline
    lashes.length=0;
    var r=rng(8081);
    var count = Math.round(W/ (narrow?7.5:9.5) );
    for(var i=0;i<count;i++){
      var x = r()*W;
      var d = Math.abs(x-lidCx)/(W*0.55);
      var vigour = Math.max(0.12, 1-d*0.78);
      var big = r()<0.045;
      var L = H*(big?0.055+r()*0.075 : 0.009+r()*0.040) * (0.45+vigour);
      var lean = (x-lidCx)/(W*0.5)*0.42 + (r()-0.5)*0.55;
      lashes.push({x:x, L:L, lean:lean, w:Math.max(0.7, L*(big?0.045:0.085)), curl:(r()-0.5)*0.9, big:big});
    }
    lashes.sort(function(a,b){return a.L-b.L});

    // the hills never move, so draw them once
    landImg=null;
    drawLand(0,0);
    landImg=document.createElement('canvas');
    landImg.width=front.width; landImg.height=front.height;
    landImg.getContext('2d').drawImage(front,0,0);
  }

  function ridgeFarAt(x){
    var d=(x-lidCx)/(W*0.62);
    return ridgeY + H*0.030 - (ridgeAmp*1.85)*d*d
         + Math.sin(x*0.0083+3.4)*H*0.016
         + Math.sin(x*0.0192+0.9)*H*0.008;
  }

  var landImg=null;
  function drawLand(t, lidDrop){
    if(landImg && lidDrop===0){
      fx.setTransform(1,0,0,1,0,0);
      fx.clearRect(0,0,front.width,front.height);
      fx.drawImage(landImg,0,0);
      fx.setTransform(dpr,0,0,dpr,0,0);
      return;
    }
    fx.clearRect(0,0,W,H);
    var yOff = lidDrop;

    // hills standing further back
    fx.beginPath();
    fx.moveTo(-4, ridgeFarAt(-4)+yOff);
    for(var xf=0;xf<=W+4;xf+=4) fx.lineTo(xf, ridgeFarAt(xf)+yOff);
    fx.lineTo(W+4,H+4); fx.lineTo(-4,H+4); fx.closePath();
    var fg=fx.createLinearGradient(0,ridgeY-H*0.20,0,ridgeY+H*0.10);
    fg.addColorStop(0,'#202020');
    fg.addColorStop(1,'#0d0d0d');
    fx.fillStyle=fg; fx.fill();

    // the lid itself
    fx.beginPath();
    fx.moveTo(-4, ridgeAt(-4)+yOff);
    for(var x=0;x<=W+4;x+=3) fx.lineTo(x, ridgeAt(x)+yOff);
    fx.lineTo(W+4,H+4); fx.lineTo(-4,H+4); fx.closePath();
    var lg=fx.createLinearGradient(0,ridgeY-H*0.02,0,H);
    lg.addColorStop(0,'#0c0c0c');
    lg.addColorStop(0.35,'#070707');
    lg.addColorStop(1,'#020202');
    fx.fillStyle=lg; fx.fill();

    // a thread of light caught on the lid edge
    fx.save();
    fx.beginPath();
    fx.moveTo(-4, ridgeAt(-4)+yOff);
    for(var x2=0;x2<=W+4;x2+=3) fx.lineTo(x2, ridgeAt(x2)+yOff);
    fx.lineWidth=1.1;
    var eg=fx.createLinearGradient(irisX-irisR*1.5,0,irisX+irisR*1.5,0);
    eg.addColorStop(0,'rgba(190,190,190,0)');
    eg.addColorStop(0.5,'rgba(240,240,240,0.62)');
    eg.addColorStop(1,'rgba(190,190,190,0)');
    fx.strokeStyle=eg; fx.stroke();
    fx.restore();

    // lashes / trees
    for(var i=0;i<lashes.length;i++){
      var l=lashes[i];
      var by=ridgeAt(l.x)+yOff;
      var tipx=l.x+Math.sin(l.lean)*l.L*0.55;
      var tipy=by-l.L;
      var cxp=l.x+Math.sin(l.lean+l.curl)*l.L*0.30;
      var cyp=by-l.L*0.55;
      fx.beginPath();
      fx.moveTo(l.x-l.w, by+1);
      fx.quadraticCurveTo(cxp-l.w*0.35, cyp, tipx, tipy);
      fx.quadraticCurveTo(cxp+l.w*0.35, cyp, l.x+l.w, by+1);
      fx.closePath();
      fx.fillStyle = l.big ? 'rgba(1,1,1,0.96)' : 'rgba(2,2,2,0.92)';
      fx.fill();
    }

    // valley mist, in front of the feet of the trees
    var mg=fx.createLinearGradient(0,ridgeY+yOff-H*0.05,0,ridgeY+yOff+H*0.15);
    mg.addColorStop(0,'rgba(107,107,107,0)');
    mg.addColorStop(0.28,'rgba(115,115,115,0.20)');
    mg.addColorStop(1,'rgba(10,10,10,0)');
    fx.fillStyle=mg;
    fx.fillRect(0,ridgeY+yOff-H*0.05,W,H*0.20);
  }

  /* ---------- gaze + pupil ---------- */
  var tx=0,ty=0,gx=0,gy=0, hasPointer=false;
  window.addEventListener('pointermove',function(e){
    hasPointer=true;
    tx=(e.clientX/W-0.5)*2; ty=(e.clientY/H-0.5)*2;
  },{passive:true});

  function frame(t){
    if(!hasPointer){
      tx=Math.sin(t*0.13)*0.55+Math.sin(t*0.047)*0.35;
      ty=Math.sin(t*0.091+1.3)*0.34;
    }
    gx+=(tx-gx)*0.035; gy+=(ty-gy)*0.035;

    var ox=gx*irisR*0.075, oy=gy*irisR*0.048;
    var pupil = irisR*(0.285 + 0.055*Math.sin(t*0.62) + 0.022*Math.sin(t*1.9+0.7));

    bx.setTransform(dpr,0,0,dpr,0,0);
    bx.clearRect(0,0,W,H);
    bx.drawImage(skyImg,0,0,W,H);

    var cxr=irisX+ox, cyr=irisY+oy;
    bx.drawImage(irisImg, cxr-irisR, cyr-irisR, irisR*2, irisR*2);

    // pupil
    var pg=bx.createRadialGradient(cxr,cyr,pupil*0.90,cxr,cyr,pupil*1.16);
    pg.addColorStop(0,'rgba(1,1,1,1)');
    pg.addColorStop(0.62,'rgba(1,1,1,0.92)');
    pg.addColorStop(1,'rgba(20,20,20,0)');
    bx.fillStyle=pg;
    bx.beginPath(); bx.arc(cxr,cyr,pupil*1.16,0,Math.PI*2); bx.fill();
    bx.fillStyle='#010101';
    bx.beginPath(); bx.arc(cxr,cyr,pupil*0.94,0,Math.PI*2); bx.fill();

    // wet: one catchlight, and a smear of sky on the dome
    bx.save();
    bx.globalCompositeOperation='lighter';
    var sx=cxr-irisR*0.40, sy=cyr-irisR*0.46;
    var sg2=bx.createRadialGradient(sx,sy,0,sx,sy,irisR*0.17);
    sg2.addColorStop(0,'rgba(255,255,255,0.92)');
    sg2.addColorStop(0.35,'rgba(240,240,240,0.22)');
    sg2.addColorStop(1,'rgba(224,224,224,0)');
    bx.fillStyle=sg2;
    bx.beginPath(); bx.arc(sx,sy,irisR*0.17,0,Math.PI*2); bx.fill();

    var sg3=bx.createRadialGradient(cxr+irisR*0.42,cyr+irisR*0.30,0,cxr+irisR*0.42,cyr+irisR*0.30,irisR*0.45);
    sg3.addColorStop(0,'rgba(171,171,171,0.16)');
    sg3.addColorStop(1,'rgba(171,171,171,0)');
    bx.fillStyle=sg3;
    bx.beginPath(); bx.arc(cxr+irisR*0.42,cyr+irisR*0.30,irisR*0.45,0,Math.PI*2); bx.fill();
    bx.restore();

    drawLand(t, 0);
  }

  var raf=null,t0=0;
  function loop(ts){ if(!t0)t0=ts; frame((ts-t0)/1000); raf=requestAnimationFrame(loop); }
  function start(){
    build();
    if(raf){cancelAnimationFrame(raf);raf=null;}
    if(reduce){ tx=-0.30; ty=-0.18; gx=tx; gy=ty; frame(0.9); }
    else { t0=0; raf=requestAnimationFrame(loop); }
  }
  start();
  var rt; window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(start,180);});
})();
</script>

<script>
(()=>{
 const sheet=document.querySelector('.magazine-sheet'),svg=document.querySelector('.page-fold'),shadow=document.querySelector('#fold-shadow'),surface=document.querySelector('#curl-surface'),handle=document.querySelector('.page-handle'),inside=document.querySelector('.magazine-under'),backButton=document.querySelector('.page-return');
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches, nx=.8,ny=.6,N=48;
 let width=innerWidth,height=innerHeight,depth=38,active=false,opened=false,hover=false,animation=0;
 // A cylindrical bend: points travel around a curved spine before returning
 // along the reverse face. The paper edges are sampled through the bend.
 const bands=Array.from({length:N+1},()=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');surface.append(p);return p});
 function clip(poly,c,less=true){const out=[];for(let i=0;i<poly.length;i++){let a=poly[i],b=poly[(i+1)%poly.length],da=nx*a[0]+ny*a[1]-c,db=nx*b[0]+ny*b[1]-c,ia=less?da<=0:da>=0,ib=less?db<=0:db>=0;if(ia)out.push(a);if(ia!==ib){let t=da/(da-db);out.push([a[0]+t*(b[0]-a[0]),a[1]+t*(b[1]-a[1])]);}}return out;}
 function path(poly){return poly.length?'M'+poly.map(p=>p.join(',')).join('L')+'Z':'';}
 function draw(d){depth=d;const cut=nx*width+ny*height-d,R=Math.min(40,Math.max(9,d*.23)),rect=[[0,0],[width,0],[width,height],[0,height]],front=clip(rect,cut),roll=Math.PI*R;
 sheet.style.clipPath=front.length?'polygon('+front.map(p=>p.map(n=>n+'px').join(' ')).join(',')+')':'polygon(0 0,0 0,0 0)';
 function project([x,y]){const u=nx*x+ny*y-cut,t=Math.max(0,Math.min(Math.PI,u/R)),q=u<=roll?R*Math.sin(t):-(u-roll),z=R*(1-Math.cos(t));return[x+nx*(q-u)-z*.12,y+ny*(q-u)-z*.22];}
 let silhouette=[];const lifted=clip(rect,cut,false);for(let i=0;i<lifted.length;i++){const a=lifted[i],b=lifted[(i+1)%lifted.length];for(let j=0;j<28;j++){const t=j/28;silhouette.push(project([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]));}}
 shadow.setAttribute('d',path(silhouette.map(([x,y])=>[x+4,y+7])));
 for(let i=0;i<=N;i++){let lo=roll*i/N,hi=i===N?1e6:roll*(i+1)/N+.15,poly=clip(clip(rect,cut+lo,false),cut+hi),mapped=poly.map(project);bands[i].setAttribute('d',path(mapped));const t=Math.PI*(i+.5)/N;let rgb;if(i<N/2){const v=Math.round(13+35*Math.pow(Math.sin(t),5));rgb=[v,v,v];}else{const light=i===N?.97:.72+.28*Math.sin((t-Math.PI/2));rgb=[249,245,233].map(v=>Math.round(v*light));}bands[i].setAttribute('fill',`rgb(${rgb.join(',')})`);bands[i].setAttribute('stroke',`rgb(${rgb.join(',')})`);bands[i].setAttribute('stroke-width','.45');}
 }
 function animate(to,duration,done){cancelAnimationFrame(animation);let start=performance.now(),from=depth;function frame(now){let t=Math.min(1,(now-start)/duration),e=t*t*(3-2*t);draw(from+(to-from)*e);if(t<1)animation=requestAnimationFrame(frame);else if(done)done();}animation=requestAnimationFrame(frame);}
 function idle(now){if(!active&&!opened){const lift=hover?56:38+(reduced?0:2.6*Math.pow((1-Math.cos(now/1150))/2,3));draw(depth+(lift-depth)*.075);}requestAnimationFrame(idle);}
 handle.addEventListener('pointerenter',()=>hover=true);handle.addEventListener('pointerleave',()=>hover=false);handle.addEventListener('focus',()=>hover=true);handle.addEventListener('blur',()=>hover=false);

 backButton.addEventListener('click',()=>{if(active)return;active=true;opened=false;inside.inert=true;inside.tabIndex=-1;document.body.classList.remove('page-open');svg.style.visibility='visible';animate(38,reduced?1:1400,()=>{active=false;document.body.classList.remove('page-turning');handle.focus({preventScroll:true});});});
