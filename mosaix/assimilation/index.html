<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>MOSAIX · Assimilation</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Tokens ── */
:root {
  --canvas: #F7F5F1;
  --surface: #FFFFFF;
  --surface-dim: #F5F2ED;
  --ink: #1A1712;
  --ink-2: #6B6560;
  --ink-3: #9B958D;
  --ink-4: #B5AFA5;
  --line: #DEDAD3;
  --line-lt: #ECE9E4;
  --hover: rgba(0,0,0,.03);
  --violet: #6D28D9;
  --violet-soft: #F0EBFF;
  --violet-mid: #8B5CF6;
  --amber: #C49A1F;
  --amber-dk: #A07D16;
  --green: #2D7A4F;
  --green-bg: #E3F3E8;
  --green-chip: #16A34A;
  --red: #C4420A;
  --red-bg: #FEF3C7;
  --orange-bg: #FFF4E6;
  --orange-chip: #EA6B0C;
  --locked-bg: #ECEAE5;
  --locked-text: #9B958D;
  --phase-assimilate-bg: #EBF0E2;
  --phase-assimilate-text: #4A5D3C;
  --phase-build-bg: #FCF0D4;
  --phase-build-text: #8B6914;
  --phase-assess-bg: #D4EDDA;
  --phase-assess-text: #2D6A4F;
  --phase-complete-bg: #D4EDDA;
  --phase-complete-text: #2D6A4F;
  --sidebar-w: 232px;
  --rail-w: 360px;
  --content-pad-l: 32px;
  --content-pad-r: 0px;
  --row-h: 52px;
  --section-h: 44px;
  --radius-card: 12px;
  --radius-pill: 20px;
  --radius-chip: 10px;
  --shadow-card: 0 1px 3px rgba(0,0,0,.06);
  --shadow-panel: -4px 0 24px rgba(0,0,0,.08);
  --z-header: 30;
  --z-dropdown: 100;
  --z-scrim: 190;
  --z-detail: 200;
  --font: 'Inter', system-ui, -apple-system, sans-serif;
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: var(--font);
  color: var(--ink);
  background: var(--canvas);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  width: 1440px;
  height: 100vh;
  min-height: 800px;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }
a { color: inherit; text-decoration: none; }

/* ── App Shell ── */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  height: 100vh;
  min-height: 800px;
}

/* ── Sidebar ── */
.sidebar {
  width: 208px;
  height: 684px;
  flex-shrink: 0;
  border-radius: 20px;
  border: 1px solid #FBFAF8;
  background: linear-gradient(180deg, rgba(238, 233, 224, 0.60) 0%, rgba(231, 227, 218, 0.60) 100%);
  box-shadow: 0 0 30px 0 rgba(0, 0, 0, 0.12);
  display: flex;
  flex-direction: column;
  padding: 24px 20px 20px;
  margin: 12px;
  position: relative;
  z-index: 10;
}
.sidebar-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 24px;
  padding: 0 4px;
}
.sidebar-logo svg { width: 28px; height: 28px; flex-shrink: 0; }
.sidebar-logo span {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--ink);
}
.sidebar-nav {
  height: 32px;
  border-radius: 8px;
  background: #FFF;
  padding: 0 12px;
  display: flex;
  align-items: center;
  align-self: stretch;
  gap: 8px;
  color: #211E19;
  font-size: 12px;
  font-weight: 500;
  line-height: 16px;
  letter-spacing: 0.24px;
}
.sidebar-nav svg { width: 14px; height: 14px; color: #211E19; flex-shrink: 0; }
.sidebar-spacer { flex: 1; }
.sidebar-section-label {
  align-self: stretch;
  color: #5C554B;
  font-size: 10px;
  font-weight: 600;
  line-height: 16px;
  letter-spacing: 0.2px;
  text-transform: uppercase;
  padding: 0 4px;
  margin-bottom: 8px;
}
.sidebar-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 4px;
  font-size: 13px;
  color: var(--ink-2);
  cursor: pointer;
  border-radius: 6px;
}
.sidebar-link:hover { background: var(--hover); }
.sidebar-link svg { width: 16px; height: 16px; color: var(--ink-3); }
.sidebar-link .notif-badge {
  background: var(--violet);
  color: #fff;
  font-size: 10px;
  font-weight: 600;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-left: auto;
}
.sidebar-benny {
  margin: 16px 0;
  height: 32px;
  padding: 0 16px;
  border: 2px solid #6318B3;
  border-radius: 29px;
  background: radial-gradient(50% 50% at 50% 50%, #EEEAE3 0%, #EBE6DE 100%);
  box-shadow: 0 0 20px 0 rgba(240, 84, 5, 0.24);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  cursor: pointer;
  transition: box-shadow .15s;
  align-self: stretch;
}
.sidebar-benny:hover { box-shadow: 0 0 28px 0 rgba(240, 84, 5, 0.32); }
.sidebar-benny svg { width: 18px; height: 18px; }
.sidebar-user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0 0;
  border-top: 1px solid var(--line);
  margin-top: 8px;
}
.sidebar-user .avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #D4A06A;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  flex-shrink: 0;
}
.sidebar-user .user-info { flex: 1; min-width: 0; }
.sidebar-user .user-name { font-size: 13px; font-weight: 600; }
.sidebar-user .user-role {
  display: flex;
  height: 16px;
  padding: 4px 7px 3px 7px;
  justify-content: center;
  align-items: center;
  align-self: stretch;
  border-radius: 8px;
  background: #C9C3B9;
  color: #5C554B;
  text-align: center;
  font-size: 8px;
  font-weight: 500;
  line-height: 9px;
  letter-spacing: -0.16px;
  margin-top: 3px;
}
.sidebar-user .logout-btn {
  color: #5C554B;
  padding: 4px;
  border-radius: 4px;
}
.sidebar-user .logout-btn:hover { background: var(--hover); }
.sidebar-user .logout-btn svg { width: 16px; height: 16px; }

/* ── Main Area ── */
.main-area {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
.main-scroll {
  display: flex;
  align-items: flex-start;
  gap: 24px;
  padding: 0 0 0 var(--content-pad-l);
  flex: 1;
  overflow: hidden;
}
.main-content {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  align-self: stretch;
}
#mainContent {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
}
#mainContent::-webkit-scrollbar { display: none; }
.main-rail {
  width: var(--rail-w);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow-y: auto;
  padding-bottom: 24px;
  padding-top: 20px;
  align-self: stretch;
  scrollbar-width: none;
}
.main-rail::-webkit-scrollbar { display: none; }

/* ── Header ── */
.header {
  padding: 28px 0 0 var(--content-pad-l);
  position: relative;
}
.header-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}
.header-left { flex: 1; }
.header-eyebrow {
  display: flex;
  width: 90px;
  height: 20px;
  flex-direction: column;
  justify-content: center;
  color: #5B21B6;
  font-size: 12px;
  font-weight: 700;
  line-height: 16px;
  letter-spacing: 0.24px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.header-title {
  color: #5C554B;
  font-size: 24px;
  font-weight: 700;
  line-height: 34px;
  letter-spacing: -0.36px;
  margin-bottom: 4px;
}
.header-subtitle {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #837C71;
  font-size: 13px;
  font-weight: 500;
  line-height: 18px;
}
.header-subtitle .phase-chip {
  display: flex;
  padding: 2px 8px;
  align-items: flex-start;
  gap: 4px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 600;
  line-height: 16px;
}
.header-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  padding-top: 4px;
}
.butterfly-wrap {
  position: relative;
  width: 77px;
  height: 60px;
}
.butterfly-ghost {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0.18;
}
.butterfly-active {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 1;
}
.header-day {
  font-size: 12px;
  color: var(--ink-3);
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 6px;
}
.header-day:hover { color: var(--violet); }

/* Day picker popover */
.day-picker {
  position: absolute;
  right: var(--content-pad-r);
  top: 96px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  box-shadow: 0 8px 24px rgba(0,0,0,.12);
  padding: 12px;
  z-index: var(--z-dropdown);
  display: none;
}
.day-picker.open { display: block; }
.day-picker-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--ink-3);
  margin-bottom: 8px;
}
.day-picker-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.day-picker-btn {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-2);
  border: 1px solid var(--line);
  transition: all .15s;
}
.day-picker-btn:hover { border-color: var(--violet); color: var(--violet); }
.day-picker-btn.active {
  background: var(--violet);
  color: #fff;
  border-color: var(--violet);
}

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid #E3E4E5;
  margin-top: 20px;
  flex-shrink: 0;
}
.tab {
  padding: 10px 16px;
  color: #5C554B;
  text-align: center;
  font-size: 13px;
  font-weight: 400;
  line-height: 20px;
  cursor: pointer;
  transition: color .15s;
  position: relative;
}
.tab:hover { color: #211E19; }
.tab.active {
  color: #211E19;
  font-weight: 600;
}
.tab.active::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  height: 3px;
  background: #6D28D9;
  border-radius: 2px 2px 0 0;
}

/* ── Toolbar ── */
.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 0;
  flex-shrink: 0;
}
.view-toggle {
  display: flex;
  padding: 2px;
  align-items: flex-start;
  border-radius: 999px;
  background: #ECE8E1;
}
.view-btn {
  display: flex;
  height: 24px;
  padding: 4px 12px;
  align-items: center;
  gap: 4px;
  border-radius: 999px;
  background: #EDEAE4;
  font-size: 12px;
  font-weight: 400;
  color: #3D3832;
  white-space: nowrap;
  line-height: 20px;
  transition: all .15s;
}
.view-btn.active {
  border: 1px solid #211E19;
  background: #211E19;
  color: #fff;
}
.toolbar-spacer { flex: 1; }
.toolbar-select {
  display: flex;
  width: 120px;
  padding: 4px 12px;
  justify-content: space-between;
  align-items: center;
  border-radius: 4px;
  border: 1px solid #D4D0C8;
  background: #FFF url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2374767C' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right 12px center;
  appearance: none;
  cursor: pointer;
  font-family: var(--font);
  font-size: 12px;
  font-weight: 400;
  color: #74767C;
  line-height: 20px;
}
.toolbar-search {
  display: flex;
  width: 180px;
  padding: 4px 12px 4px 32px;
  align-items: center;
  border-radius: 4px;
  border: 1px solid #D4D0C8;
  background: #FFF url("data:image/svg+xml,%3Csvg width='14' height='14' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='11' cy='11' r='7' stroke='%2374767C' stroke-width='2'/%3E%3Cpath d='M16 16l4 4' stroke='%2374767C' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat 12px center;
  font-family: var(--font);
  font-size: 12px;
  font-weight: 400;
  color: #74767C;
  line-height: 20px;
}
.toolbar-search::placeholder { color: #74767C; }

/* ── Banner ── */
.banner {
  display: flex;
  padding: 8px;
  align-items: center;
  gap: 8px;
  align-self: stretch;
  border-radius: 8px;
  margin-bottom: 12px;
  flex-shrink: 0;
}
.banner-warn {
  border: 1px solid #B45309;
  background: rgba(245, 144, 22, 0.10);
}
.banner-info {
  border: 1px solid #104608;
  background: rgba(33, 179, 43, 0.08);
}
.banner-warn svg { width: 16px; height: 16px; flex-shrink: 0; color: #8A3E05; position: relative; top: -1px; }
.banner-warn .banner-text { color: #8A3E05; }
.banner-warn .banner-close { color: #8A3E05; }
.banner-info svg { width: 16px; height: 16px; flex-shrink: 0; color: #104608; position: relative; top: -1px; }
.banner-info .banner-text { color: #104608; }
.banner-info .banner-text strong { font-weight: 600; }
.banner-info .banner-text a { color: #104608; text-decoration: underline; font-weight: 400; }
.banner-info .banner-close { color: #104608; }
.banner-text {
  flex: 1;
  font-size: 12px;
  font-weight: 400;
  line-height: 20px;
}
.banner-text a { color: var(--violet); font-weight: 500; }
.banner-warn .banner-link { font-size: 12px; font-weight: 500; line-height: 20px; text-decoration: underline; white-space: nowrap; flex-shrink: 0; color: #8A3E05; }
.banner-info .banner-link { font-size: 12px; font-weight: 500; line-height: 20px; text-decoration: underline; white-space: nowrap; flex-shrink: 0; color: #104608; }
.banner-close {
  color: inherit;
  opacity: .5;
  padding: 2px;
  border-radius: 4px;
  position: relative;
  top: 3px;
}
.banner-close:hover { opacity: 1; }

/* ── Hero cards (Welcome, Phase, Complete) ── */
.hero-card {
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.hero-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
}
.hero-card.welcome {
  display: flex;
  padding: 20px 24px;
  flex-direction: column;
  align-items: flex-start;
  gap: 24px;
  align-self: stretch;
  border-radius: 22px;
  border: 1px solid #E7DBFF;
  background: linear-gradient(180deg, #FFF 0%, #FBF7FF 100%);
  box-shadow: 0 10px 30px 0 rgba(33, 30, 25, 0.09);
}
.hero-card.welcome::before {
  height: 5px;
  border-radius: 22px 22px 0 0;
  background: linear-gradient(90deg, #6D28D9 0%, #7C3AED 60%, #F59016 100%);
}
.hero-card.welcome .hero-title {
  color: #211E19;
  font-size: 18px;
  font-weight: 600;
  line-height: normal;
  letter-spacing: 0.36px;
  margin-bottom: 0;
}
.hero-card.welcome .hero-body {
  color: #5C554B;
  font-size: 14px;
  font-weight: 400;
  line-height: 20px;
  letter-spacing: 0.7px;
  max-width: 658px;
}
.hero-card.phase-new {
  padding: 20px 24px;
  gap: 12px;
  border-radius: 22px;
  border: 1px solid #C2AF93;
  background: #E6DDCD;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}
.hero-card.phase-new::before { display: none; }
.hero-card.phase-new .hero-eyebrow {
  color: #8A3E05;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 0;
}
.hero-card.phase-new .hero-title {
  color: #211E19;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.32px;
  margin-bottom: 0;
}
.hero-card.phase-new .hero-body {
  color: #5C554B;
  font-size: 12px;
  font-weight: 400;
  line-height: 20px;
  max-width: 479px;
}
.hero-card.complete {
  padding: 20px 24px;
  gap: 24px;
  border-radius: 22px;
  border: 1px solid #E7DBFF;
  background: linear-gradient(180deg, #FFF 0%, #F9FFF7 100%);
  box-shadow: 0 10px 30px 0 rgba(33, 30, 25, 0.09);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}
.hero-card.complete::before {
  height: 5px;
  border-radius: 22px 22px 0 0;
  background: linear-gradient(90deg, #2BA534 0%, #7C3AED 50.15%, #F59016 100%);
}
.hero-card.complete .hero-title {
  color: #211E19;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.36px;
  margin-bottom: 0;
}
.hero-card.complete .hero-body {
  color: #5C554B;
  font-size: 14px;
  font-weight: 400;
  line-height: 20px;
  letter-spacing: 0.7px;
  max-width: 631px;
}
.hero-card .hero-eyebrow {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 4px;
}
.hero-card .hero-title {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 8px;
}
.hero-card .hero-body {
  font-size: 14px;
  color: var(--ink-2);
  line-height: 1.6;
  max-width: 560px;
}

/* ── Week summary row ── */
.week-summary {
  display: flex;
  padding: 10px 16px;
  align-items: center;
  gap: 16px;
  align-self: stretch;
  background: #ECE8E1;
  flex-shrink: 0;
  font-size: 11px;
  font-weight: 500;
  line-height: 14px;
  letter-spacing: 0.2px;
  color: #837C71;
}
.week-summary strong {
  font-weight: 700;
  color: #211E19;
}
.week-summary .ws-spacer { flex: 1; }
.week-summary .ws-count {
  font-variant-numeric: tabular-nums;
  color: #211E19;
  text-align: right;
  font-weight: 500;
}
.week-summary .ws-count b { font-weight: 700; color: #211E19; }

/* ── Progress bar (inline) ── */
.progress-bar {
  width: 107px;
  height: 4px;
  background: #DEDAD3;
  border-radius: 999px;
  overflow: hidden;
  flex-shrink: 0;
  position: relative;
}
.progress-bar .fill {
  height: 100%;
  background: #6D28D9;
  border-radius: 999px;
  transition: width .3s ease;
}

/* ── Column headers ── */
.col-headers {
  display: grid;
  grid-template-columns: 280px 120px 64px 64px 1fr;
  align-items: center;
  padding: 8px 16px;
  gap: 16px;
  color: #837C71;
  font-size: 10px;
  font-weight: 700;
  line-height: 12px;
  letter-spacing: 0.2px;
  text-transform: uppercase;
  border-bottom: 1px solid #837C71;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  background: var(--canvas);
  z-index: var(--z-header);
}

/* ── Section header (accordion) ── */
.section-hdr {
  display: flex;
  padding: 10px 16px;
  align-items: center;
  gap: 16px;
  align-self: stretch;
  background: #ECE8E1;
  cursor: pointer;
  user-select: none;
  position: relative;
}
.section-hdr:hover { background: #E5E1DA; }
.section-label {
  color: #211E19;
  font-size: 11px;
  font-weight: 700;
  line-height: 14px;
  letter-spacing: 0.2px;
  text-transform: uppercase;
}
.section-meta {
  color: #837C71;
  font-size: 10px;
  font-weight: 500;
  line-height: 12px;
  letter-spacing: 0.2px;
}

}
.tour-splash.hidden { display: none; }
.tour-splash-card {
  width: 440px;
  padding: 40px 44px;
  border-radius: 28px;
  background: linear-gradient(180deg, #FFF 0%, #FBF7FF 100%);
  border: 1px solid #E7DBFF;
  box-shadow: 0 20px 60px rgba(33, 30, 25, 0.25);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.tour-splash-eyebrow {
  color: #6D28D9;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.tour-splash-title {
  color: #211E19;
  font-size: 24px;
  font-weight: 600;
  line-height: 30px;
  letter-spacing: 0.24px;
}
.tour-splash-body {
  color: #5C554B;
  font-size: 14px;
  font-weight: 400;
  line-height: 21px;
  letter-spacing: 0.14px;
  max-width: 360px;
  margin-bottom: 12px;
}
.tour-splash-cta {
  display: inline-flex;
  padding: 12px 32px;
  justify-content: center;
  align-items: center;
  gap: 8px;
  border-radius: 999px;
  background: #5B21B6;
  color: #FFF;
  font-size: 15px;
  font-weight: 600;
  line-height: 22px;
  letter-spacing: 0.3px;
  box-shadow: 0 4px 14px rgba(109, 40, 217, 0.4);
  cursor: pointer;
  border: none;
}
.tour-splash-cta:hover { background: #4C1D95; }
.tour-splash-skip {
  color: #9E998E;
  font-size: 12px;
  font-weight: 400;
  cursor: pointer;
  background: none;
  border: none;
  padding: 8px;
  margin-top: 4px;
}
.tour-splash-skip:hover { color: #5C554B; }

/* ── Walkthrough Tour ── */
.tour-overlay {
  position: fixed;
  inset: 0;
  z-index: 9000;
  display: none;
  pointer-events: none;
}
.tour-overlay.active { display: block; }
.tour-scrim {
  position: absolute;
  inset: 0;
  pointer-events: auto;
}
.tour-highlight {
  position: absolute;
  border-radius: 16px;
  box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55);
  z-index: 9001;
  pointer-events: none;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
.tour-tooltip {
  position: absolute;
  z-index: 9002;
  width: 320px;
  padding: 20px 24px;
  border-radius: 18px;
  background: #FFF;
  border: 1px solid #ECE8E1;
  box-shadow: 0 10px 40px rgba(33, 30, 25, 0.18);
  pointer-events: auto;
  transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.tour-tooltip-step {
  color: #6D28D9;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.tour-tooltip-title {
  color: #211E19;
  font-size: 16px;
  font-weight: 600;
  line-height: 22px;
  margin-bottom: 6px;
}
.tour-tooltip-body {
  color: #5C554B;
  font-size: 13px;
  font-weight: 400;
  line-height: 19px;
  letter-spacing: 0.13px;
  margin-bottom: 16px;
}
.tour-tooltip-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.tour-btn-next {
  display: flex;
  padding: 6px 18px;
  justify-content: center;
  align-items: center;
  border-radius: 999px;
  background: #5B21B6;
  color: #FFF;
  font-size: 13px;
  font-weight: 500;
  line-height: 20px;
  letter-spacing: 0.26px;
  box-shadow: 0 2px 6px rgba(109, 40, 217, 0.3);
  cursor: pointer;
}
.tour-btn-next:hover { background: #4C1D95; }
.tour-btn-skip {
  color: #9E998E;
  font-size: 12px;
  font-weight: 400;
  cursor: pointer;
  background: none;
  border: none;
  padding: 4px 8px;
}
.tour-btn-skip:hover { color: #5C554B; }
.tour-dots {
  display: flex;
  gap: 6px;
  margin-left: auto;
}
.tour-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #DEDAD3;
}
.tour-dot.active { background: #6D28D9; }
.tour-start-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid #E7DBFF;
  background: #F3EEFF;
  color: #6D28D9;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.22px;
  margin-top: 12px;
}
.tour-start-btn:hover { background: #E7DBFF; }
</style>

/* ══════════════════════════════════════════════
   UTILITIES
   ══════════════════════════════════════════════ */
function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}

function fmtDate(day) {
  const d = addDays(START, day - 1);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[d.getMonth()] + ' ' + d.getDate();
}

function fmtDateLong(day) {
  const d = addDays(START, day - 1);
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate();
}

function getMonth(day) {
  return Math.ceil(day / 30);
}

function getPhase(day) {
  if (day >= 173) return PHASES[2];
  if (day >= 61) return PHASES[1];
  return PHASES[0];
}

function getStatus(item, today) {
  const phase = PHASES.find(p => p.id === item.phase);
  if (today < phase.unlockDay) return 'Locked';
  if (item.completedDay && item.completedDay <= today) return 'Complete';
  if (item.startedDay && item.startedDay <= today) return 'In progress';
  if (item.dueDay <= today && (!item.completedDay || item.completedDay > today)) return 'Overdue';
  return 'Not started';
}

function statusClass(s) {
  return s.toLowerCase().replace(/\s/g, '-');
}

function getActionLabel(status) {
  switch(status) {
    case 'Complete': return 'View';
    case 'In progress': return 'Continue';
    case 'Overdue': return 'Start';
    case 'Locked': return 'Preview';
    default: return 'Start';
  }
}

function getDoneCount(items, today) {
  return items.filter(i => {
    const s = getStatus(i, today);
    return s === 'Complete';
  }).length;
}

function getOverdueCount(items, today) {
  return items.filter(i => getStatus(i, today) === 'Overdue').length;
}

function isThisWeek(item, today) {
  const s = getStatus(item, today);
  if (s === 'Overdue') return true;
  if (s === 'In progress') return true;
  if (s === 'Complete') return false;
  if (s === 'Locked') return false;
  if (today >= 170) return true;
  return item.dueDay > today && item.dueDay <= today + 7;
}

  const chip = document.getElementById('headerPhaseChip');
  if (allDone) {
    chip.textContent = 'Complete';
    chip.className = 'phase-chip complete-phase';
  } else if (state.today >= 170 && p.id === 'build') {
    chip.textContent = 'Assess';
    chip.className = 'phase-chip assess-gradient';
  } else {
    chip.textContent = p.label.charAt(0) + p.label.slice(1).toLowerCase();
    chip.className = 'phase-chip ' + p.id;
  }
  document.getElementById('dayLabel').textContent = 'Day ' + state.today + ' of ' + TOTAL_DAYS;

  const grid = document.getElementById('dayPickerGrid');
  grid.innerHTML = DAY_PRESETS.map(d =>
    `<button class="day-picker-btn${d === state.today ? ' active' : ''}" onclick="setDay(${d})">Day ${d}</button>`

}

function renderBennyCard() {
  const totalDone = getDoneCount(ITEMS, state.today);
  const overdueItems = ITEMS.filter(i => getStatus(i, state.today) === 'Overdue');
  const allDone = totalDone === ITEMS.length;
  let body = '', cta1 = '', cta2 = '';

  if (state.tab === 'resources') {
    body = `Need a hand finding something?<br><br>For your overdue <strong>Information Security Essentials</strong>, the doc you want is the <strong>Information security policy</strong>.`;
    cta1 = 'Open'; cta2 = 'Ask Benny';
  } else if (allDone) {
    body = `You did it, Rachel. <strong>46 of 46</strong>, and your butterfly is whole.<br><br>Want to look back at the six months, or export your plan as a record?`;
    cta1 = 'Recap'; cta2 = 'Export';
  } else if (state.today <= 3) {
    body = `Welcome, Rachel. I've laid out your <strong>first week</strong> so nothing is a guess.<br><br>Start with <strong>Welcome to Acme</strong>, it's five minutes and sets up the rest.`;
    cta1 = 'Open'; cta2 = 'Take a tour';
  } else if (state.today >= 170) {
    body = `Your <strong>six-month review</strong> is open.<br><br>I pulled together everything you shipped since day one. Want a recap before you begin?`;
    cta1 = 'Start review'; cta2 = 'Show recap';
  } else if (state.today === 90) {

function renderPeopleCard() {
  let visiblePeople;
  if (state.today >= 170) visiblePeople = PEOPLE.slice(0, 2);
  else if (state.today >= 61) visiblePeople = [PEOPLE[0], PEOPLE[1], PEOPLE[4]];
  else if (state.view === 'week' && ITEMS.filter(i => isThisWeek(i, state.today)).length === 0) visiblePeople = PEOPLE.slice(0, 2);
  else visiblePeople = PEOPLE;

  let h = `<div class="people-card"><div class="people-title">YOUR PEOPLE</div>`;
  visiblePeople.forEach(p => {
    h += `<div class="person-row">
      ${p.img ? `<img class="person-avatar" src="../images/${p.img}" alt="${p.name}">` : `<div class="person-avatar-fallback" style="background:${p.color}">${p.initials}</div>`}
      <div class="person-info">
        <div class="person-name">${p.name}${p.buddy?'<span class="buddy-badge">BUDDY</span>':''}</div>
        <div class="person-role">${p.role}</div>
      </div>
      <button class="person-msg-btn">Message</button>
    </div>`;
  });
  h += `<div class="people-footer"><a href="#" onclick="return false">Meet your team →</a></div></div>`;
  return h;
}

function renderRecentCard() {
  let h = `<div class="recent-card"><div class="recent-title">RECENTLY OPENED</div>`;
  RECENT_OPENED.forEach(r => {
    const cls = r.format === 'VID' ? ' vid' : r.format === 'LNK' ? ' lnk' : '';
    h += `<div class="recent-row">
      <span class="recent-format${cls}">${r.format}</span>
      <span class="recent-name">${r.name}</span>
      <span class="recent-time">${r.time}</span>
    </div>`;
  });
  h += `<div class="recent-footer"><a href="#" onclick="return false">View all recent →</a></div></div>`;
  return h;
}

    h += `<p class="detail-desc">${item.desc}</p>`;

      h += `<hr class="detail-divider">`;
      h += `<div class="detail-section-label">STEPS</div>`;
      h += '<ol class="detail-steps">';
      item.steps.forEach(st => { h += `<li>${st}</li>`; });
      h += '</ol>';
      h += `<div class="detail-checkbox">
        <label class="detail-checkbox-label"><input type="checkbox"><span class="detail-checkbox-text">I have read and understood the ${item.title.replace('Essentials','').trim()} policy.</span></label>
        <div class="detail-checkbox-sub">Your acknowledgment is recorded with the date and kept on file.</div>
      </div>`;
    }
    if (s === 'Overdue') {
      h += `<div class="detail-benny">
        <div class="benny-avatar"><svg class="benny-bg" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="14" fill="url(#bennyGrad)"/><defs><linearGradient id="bennyGrad" x1="0" y1="14" x2="28" y2="14" gradientUnits="userSpaceOnUse"><stop stop-color="#3F1484"/><stop offset="0.5" stop-color="#632AC5"/><stop offset="1" stop-color="#F97316"/></linearGradient></defs></svg><svg class="benny-icon" viewBox="0 0 20.9766 19.9316" fill="white" fill-opacity="0.85"><path d="M17.4316 13.1348C17.7344 15.5371 17.7832 15.5762 20.2344 15.9277C20.459 15.9668 20.6152 16.123 20.6152 16.3379C20.6152 16.543 20.459 16.709 20.2441 16.748C17.7539 17.2266 17.7441 17.207 17.4316 19.5508C17.4023 19.7656 17.2266 19.9219 17.0215 19.9219C16.7969 19.9219 16.6309 19.7559 16.6113 19.5312C16.3184 17.1875 16.2695 17.1484 13.8281 16.748C13.584 16.709 13.4277 16.5527 13.4277 16.3379C13.4277 16.1426 13.5742 15.9766 13.7891 15.9277C16.2695 15.459 16.3184 15.4883 16.6113 13.1445C16.6309 12.9199 16.7969 12.7539 17.0215 12.7539C17.2363 12.7539 17.4121 12.9102 17.4316 13.1348Z"/><path d="M6.74805 0.283203C7.08008 2.06055 7.03125 2.00195 8.80859 2.35352C8.98438 2.38281 9.10156 2.50977 9.10156 2.67578C9.10156 2.8418 8.98438 2.97852 8.80859 3.00781C7.03125 3.35938 7.08008 3.30078 6.74805 5.07812C6.71875 5.25391 6.58203 5.36133 6.41602 5.36133C6.25 5.36133 6.11328 5.25391 6.08398 5.07812C5.75195 3.30078 5.80078 3.35938 4.02344 3.00781C3.84766 2.97852 3.73047 2.8418 3.73047 2.67578C3.73047 2.50977 3.84766 2.38281 4.02344 2.35352C5.80078 2.00195 5.75195 2.06055 6.08398 0.283203C6.11328 0.107422 6.25 0 6.41602 0C6.58203 0 6.71875 0.107422 6.74805 0.283203Z"/><path d="M9.16016 16.8262C9.16016 18.3594 7.91016 19.6094 6.39648 19.6094C4.86328 19.6094 3.61328 18.3594 3.61328 16.8262C3.61328 15.3125 4.86328 14.0625 6.39648 14.0625C7.91016 14.0625 9.16016 15.3125 9.16016 16.8262ZM5.08789 16.8262C5.08789 17.5488 5.67383 18.125 6.39648 18.125C7.09961 18.125 7.68555 17.5293 7.68555 16.8262C7.68555 16.123 7.09961 15.5371 6.39648 15.5371C5.68359 15.5371 5.08789 16.123 5.08789 16.8262Z"/><path d="M5.16602 8.18359C5.16602 9.60938 3.99414 10.7715 2.58789 10.7715C1.16211 10.7715 0 9.60938 0 8.18359C0 6.77734 1.16211 5.61523 2.58789 5.61523C3.99414 5.61523 5.16602 6.77734 5.16602 8.18359ZM1.47461 8.18359C1.47461 8.79883 1.97266 9.29688 2.58789 9.29688C3.19336 9.29688 3.69141 8.79883 3.69141 8.18359C3.69141 7.58789 3.19336 7.08984 2.58789 7.08984C1.97266 7.08984 1.47461 7.58789 1.47461 8.18359Z"/><path d="M20.2246 5.70312C20.2246 8.25195 18.1543 10.3125 15.5957 10.3125C15.5274 10.3125 15.4594 10.311 15.3933 10.3023C15.4496 10.0449 15.4785 9.777 15.4785 9.50195C15.4785 9.27181 15.4581 9.04648 15.4156 8.82883C15.4745 8.83616 15.5349 8.83789 15.5957 8.83789C17.334 8.83789 18.75 7.44141 18.75 5.70312C18.75 3.95508 17.3535 2.55859 15.5957 2.55859C13.8477 2.55859 12.4512 3.95508 12.4512 5.70312C12.4512 5.72999 12.4515 5.75678 12.4552 5.78267C12.205 5.73037 11.9456 5.70312 11.6797 5.70312C11.4403 5.70312 11.2061 5.72521 10.98 5.77013C10.9767 5.74834 10.9766 5.72575 10.9766 5.70312C10.9766 3.1543 13.0469 1.08398 15.5957 1.08398C18.1543 1.08398 20.2246 3.1543 20.2246 5.70312Z"/><path d="M11.6797 13.3008C13.7793 13.3008 15.4785 11.6113 15.4785 9.50195C15.4785 7.40234 13.7793 5.70312 11.6797 5.70312C9.58008 5.70312 7.88086 7.40234 7.88086 9.50195C7.88086 11.6113 9.58008 13.3008 11.6797 13.3008ZM11.6797 11.8262C10.3906 11.8262 9.35547 10.8008 9.35547 9.50195C9.35547 8.21289 10.3906 7.17773 11.6797 7.17773C12.9688 7.17773 14.0039 8.21289 14.0039 9.50195C14.0039 10.8008 12.9688 11.8262 11.6797 11.8262Z"/></svg></div>
        <div class="detail-benny-text">This one is <strong>past its date</strong>. It takes about ${item.dur}. Want me to hold ${item.dur} tomorrow morning?</div>
      </div>`;
    }
  }

  // Default detail (Content, Manager brief, Assessment)
  else {
    h += `<div class="detail-section-label">WHAT IS THIS</div>`;
    h += `<p class="detail-desc">${item.desc}</p>`;
  }

  h += '</div>';
  dc.innerHTML = h;

  // Action buttons — rendered into separate sticky container
  let ah = '';
  if (item.type === 'Course' && s === 'Locked') {
    ah = `<div class="detail-actions"><button class="detail-btn secondary">Preview outline</button></div>`;
  } else if (item.type === 'Person') {
    ah = `<div class="detail-actions"><button class="detail-btn primary">Schedule</button><button class="detail-btn secondary">Message</button></div>`;
  } else if (s === 'Overdue' || s === 'Not started') {
    ah = `<div class="detail-actions"><button class="detail-btn primary">Start now</button><button class="detail-btn secondary">Mark complete</button></div>`;
  } else if (s === 'In progress') {
    ah = `<div class="detail-actions"><button class="detail-btn primary">Continue</button><button class="detail-btn secondary">Mark complete</button></div>`;
  } else if (s === 'Complete') {
    ah = `<div class="detail-actions"><button class="detail-btn secondary">View again</button></div>`;
  }
  document.getElementById('detailActions').innerHTML = ah;
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  state.detailItem = null;
}

/* ══════════════════════════════════════════════
   INTERACTIONS
   ══════════════════════════════════════════════ */
function setDay(d) {
  state.today = d;
  state.bannerDismissed = false;
  state.dayPickerOpen = false;
  document.getElementById('dayPicker').classList.remove('open');

  // Hard-coded per-day item overrides
  const byId = id => ITEMS.find(i => i.id === id);
  if (d >= 90) {
    byId(15).completedDay = 26;
    byId(17).completedDay = 56;
    byId(18).completedDay = 45;
    byId(19).completedDay = 47;
    byId(20).completedDay = 50;
  } else {
    byId(15).completedDay = null;
    byId(17).completedDay = null;
    byId(18).completedDay = null;
    byId(19).completedDay = null;
    byId(20).completedDay = null;
  }
  // Unlock assess phase early at Day 172 so item 46 is visible
  PHASES[2].unlockDay = (d >= 172) ? 172 : 173;

  // Day 180: all items complete
  if (d >= 180) {
    byId(43).completedDay = 167;
    byId(45).completedDay = 174;
    byId(46).completedDay = 179;
    state.view = 'full';
  } else {
    byId(43).completedDay = null; byId(43).startedDay = 165;
    byId(45).completedDay = null;
    byId(46).completedDay = null;
  }

  state.statusFilter = 'All';
  state.search = '';
  render();
}

function setView(v) {
  state.view = v;
  render();
}

function switchTab(t) {
  state.tab = t;
  state.search = '';
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === t));
  render();
}

function toggleSection(id) {
  state.collapsed[id] = !state.collapsed[id];
  render();
}

function toggleDayPicker() {
  state.dayPickerOpen = !state.dayPickerOpen;
  document.getElementById('dayPicker').classList.toggle('open', state.dayPickerOpen);
}

function toggleStar(id) {
  const r = RESOURCES.find(x => x.id === id);
  if (r) r.starred = !r.starred;
  render();
}

document.addEventListener('click', e => {
  if (state.dayPickerOpen && !e.target.closest('.day-picker') && !e.target.closest('#dayToggle')) {
    state.dayPickerOpen = false;
    document.getElementById('dayPicker').classList.remove('open');
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeDetail();
    if (state.dayPickerOpen) {
      state.dayPickerOpen = false;
      document.getElementById('dayPicker').classList.remove('open');
    }
  }
});

/* ══════════════════════════════════════════════
   WALKTHROUGH TOUR
   ══════════════════════════════════════════════ */
const TOUR_STEPS = [
  {
    target: '.header',
    title: 'Employee progress at a glance',
    body: 'The header shows where the employee is in their journey: their name, how far along they are, and which phase they are currently in.',
    pos: 'below'
  },
  {
    target: '.butterfly-wrap',
    title: 'The butterfly',
    body: 'The butterfly fills in as the employee completes items. It starts as a faint outline and becomes whole by the end of their six-month journey.',
    pos: 'below-left'
  },
  {
    target: '#dayToggle',
    title: 'Preview different stages',
    body: 'This is a prototype tool, not part of the real product. Use it to jump between days and see how the interface looks at different points in the six-month journey.',
    pos: 'below-left'
  },
  {
    target: '.tabs',
    title: 'Plan and Resources',
    body: 'The Plan tab lists every onboarding item: compliance tasks, courses, people to meet, and assessments. Resources holds reference material the employee can revisit anytime.',
    pos: 'below'
  },
  {
    target: '.view-toggle',
    title: 'This week vs. all six months',
    body: 'The employee defaults to "This Week" which surfaces only what is due soon. "All Six Months" shows the full plan across every phase.',
    pos: 'below'
  },
  {
    target: '#mainRail',
    title: 'Benny, the AI assistant',
    body: 'Benny lives in the right rail and adapts to context. It greets new hires, nudges when things are overdue, and celebrates milestones. Below Benny, the People card shows who the employee will be meeting.',
    pos: 'left'
  },
  {
    target: '.item-row',
    title: 'Click any row for details',
    body: 'Every item opens a detail panel with context, steps, and actions. Try clicking a row after this tour ends.',
    pos: 'below'
  }
];

let tourStep = 0;

function dismissSplash(startTourAfter) {
  document.getElementById('tourSplash').classList.add('hidden');
  if (startTourAfter) startTour();
}

function startTour() {
  tourStep = 0;
  document.getElementById('tourOverlay').classList.add('active');
  showTourStep();
}

function endTour() {
  document.getElementById('tourOverlay').classList.remove('active');
}

function nextTourStep() {
  tourStep++;
  if (tourStep >= TOUR_STEPS.length) { endTour(); return; }
  showTourStep();
}

function showTourStep() {
  const step = TOUR_STEPS[tourStep];
  const el = document.querySelector(step.target);
  if (!el) { nextTourStep(); return; }

  const r = el.getBoundingClientRect();
  const pad = 10;

  const hl = document.getElementById('tourHighlight');
  hl.style.top = (r.top - pad) + 'px';
  hl.style.left = (r.left - pad) + 'px';
  hl.style.width = (r.width + pad * 2) + 'px';
  hl.style.height = (r.height + pad * 2) + 'px';

  document.getElementById('tourStep').textContent = 'Step ' + (tourStep + 1) + ' of ' + TOUR_STEPS.length;
  document.getElementById('tourTitle').textContent = step.title;
  document.getElementById('tourBody').textContent = step.body;
  document.getElementById('tourNext').textContent = tourStep === TOUR_STEPS.length - 1 ? 'Finish' : 'Next';

  let dotsH = '';
  for (let i = 0; i < TOUR_STEPS.length; i++) {
    dotsH += `<div class="tour-dot${i === tourStep ? ' active' : ''}"></div>`;
  }
  document.getElementById('tourDots').innerHTML = dotsH;

  const tt = document.getElementById('tourTooltip');
  const tw = 320;
  let tx, ty;

  if (step.pos === 'below') {
    tx = r.left;
    ty = r.bottom + 16;
  } else if (step.pos === 'below-left') {
    tx = r.right - tw;
    ty = r.bottom + 16;
  } else if (step.pos === 'left') {
    tx = r.left - tw - 20;
    ty = r.top;
  } else {
    tx = r.left;
    ty = r.bottom + 16;
  }

  if (tx < 16) tx = 16;
  if (tx + tw > 1440) tx = 1440 - tw - 16;
  if (ty + 200 > window.innerHeight) ty = r.top - 200;

  tt.style.left = tx + 'px';
  tt.style.top = ty + 'px';
}

document.addEventListener('keydown', e => {
  if (document.getElementById('tourOverlay').classList.contains('active')) {
    if (e.key === 'Escape') endTour();
    if (e.key === 'ArrowRight' || e.key === 'Enter') nextTourStep();
  }
});

/* ── Init ── */
render();
</script>
